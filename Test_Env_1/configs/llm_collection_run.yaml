planner_type: llm
model: gpt-5.4
task_adapter: agentic.tasks.collection.adapter
environment_config_path: collection_env.yaml
behavior_set_path: ../behavior_sets/collection.yaml
goal: maximize_collection_value
task_prompt: >-
  Maximize total deposited value before timeout while respecting carry capacity,
  only acting through visible objects and depositing held objects at the dropoff.
  Do not treat pickup alone as success; the tree should only complete once
  collection_value_goal_met is satisfied or no further progress is possible.
system_prompt_path: ../prompts/collection_planner_system.txt
user_prompt_include_environment_summary: true
max_tree_ticks: 30
retry_limit: 1
output_dir: ../outputs
output_namespace: collection_llm_runs
logging:
  render_grid_each_tick: true
critic:
  enabled: true
  model: gpt-5.4
  interval_ticks: 3
  max_repairs: 3
  context_window_events: 8
  context_window_ticks: 6
